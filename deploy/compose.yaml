services:
  market-api:
    build:
      context: ..
      dockerfile: services/market-api/Dockerfile
    image: weiwei-market-api:0.8.0
    container_name: weiwei-market-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      WEIWEI_DATA_DIR: /var/lib/weiwei
      WEIWEI_HISTORY_AUTO_START: "1"
      WEIWEI_CORS_ORIGINS: "tauri://localhost,http://tauri.localhost,http://127.0.0.1:5173,http://localhost:5173"
    volumes:
      - ../data:/var/lib/weiwei
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
