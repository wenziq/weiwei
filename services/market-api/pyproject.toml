[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weiwei-market-api"
version = "0.4.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.30,<0.35",
  "pydantic>=2.9,<3",
  "pypinyin>=0.51,<1",
  "tzdata>=2025.2",
  "keyring>=25,<26"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
